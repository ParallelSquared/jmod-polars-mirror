name: Release

# Repack conda-forge's free-threaded polars-runtime-32 for one polars version,
# test each wheel on its platform, and publish them as the release v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "polars version, e.g. 1.44.2"
        required: true
      publish:
        description: "Publish the release (off: build and test only)"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.14 python -I repack.py "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist

  test:
    needs: repack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            tag: manylinux_2_17_x86_64
          - runner: ubuntu-24.04-arm
            tag: manylinux_2_17_aarch64
          - runner: macos-15-intel
            tag: macosx_11_0_x86_64
          - runner: macos-latest
            tag: macosx_11_0_arm64
          - runner: windows-latest
            tag: win_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Check the manylinux tag
        if: runner.os == 'Linux'
        run: |
          uvx auditwheel show dist/*-${{ matrix.tag }}.*.whl | tee auditwheel.txt
          tr '\n' ' ' < auditwheel.txt | grep -q 'consistent with the following platform tag: "${{ matrix.tag }}"'
      - name: Install into free-threaded Python
        run: |
          uv venv --python 3.14t
          uv pip install --python .venv dist/*-${{ matrix.tag }}*.whl "polars==${{ inputs.version }}"
      - run: uv run --no-project --python .venv python -I smoke_test.py "${{ inputs.version }}"

  release:
    needs: test
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - name: Publish v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "v${{ inputs.version }}" *.whl SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "polars-runtime-32 ${{ inputs.version }} (free-threaded)" \
            --notes "conda-forge's cp314t builds of polars-runtime-32 ${{ inputs.version }}, repacked as wheels. Install alongside polars==${{ inputs.version }} from PyPI."
