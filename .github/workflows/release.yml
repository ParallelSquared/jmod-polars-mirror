name: Release

# Repack conda-forge's free-threaded polars-runtime-32 for the version in
# POLARS_VERSION and test each wheel on its platform.  On main, publish them
# as the release v<version> if it does not exist yet.  Pull requests build and
# test only.
on:
  push:
    branches: [main]
    paths:
      - POLARS_VERSION
      - repack.py
      - smoke_test.py
      - .github/workflows/release.yml
  pull_request:
    paths:
      - POLARS_VERSION
      - repack.py
      - smoke_test.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < POLARS_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.14 python -I repack.py "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist

  test:
    needs: repack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            tag: manylinux_2_17_x86_64
          - runner: ubuntu-24.04-arm
            tag: manylinux_2_17_aarch64
          - runner: macos-15-intel
            tag: macosx_11_0_x86_64
          - runner: macos-latest
            tag: macosx_11_0_arm64
          - runner: windows-latest
            tag: win_amd64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.repack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Check the manylinux tag
        if: runner.os == 'Linux'
        run: |
          uvx auditwheel show dist/*-${{ matrix.tag }}.*.whl | tee auditwheel.txt
          tr '\n' ' ' < auditwheel.txt | grep -q 'consistent with the following platform tag: "${{ matrix.tag }}"'
      - name: Install into free-threaded Python
        run: |
          uv venv --python 3.14t
          uv pip install --python .venv dist/*-${{ matrix.tag }}*.whl "polars==$VERSION"
      - run: uv run --no-project --python .venv python -I smoke_test.py "$VERSION"

  release:
    needs: [repack, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.repack.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - name: Publish v${{ needs.repack.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already released; a release is never replaced"
            exit 0
          fi
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "v$VERSION" *.whl SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "polars-runtime-32 $VERSION (free-threaded)" \
            --notes "conda-forge's cp314t builds of polars-runtime-32 $VERSION, repacked as wheels. Install alongside polars==$VERSION from PyPI."
